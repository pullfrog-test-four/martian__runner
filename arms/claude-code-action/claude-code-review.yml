name: Claude Code Review

# the template `claude /install-github-app` installs (CODE_REVIEW_PLUGIN_WORKFLOW_CONTENT),
# with four martian-bench changes: `--comment` so the plugin posts its findings (Martian's
# own `claude` arm ran `/code-review:code-review --comment`), the same model and effort
# as the Pullfrog arm, the workflow token instead of the Claude GitHub App (not installed
# on this org), and the action pinned to the SHA `@v1` resolved to on 2026-09-29.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          claude_args: '--model claude-opus-5-5 --effort high'
